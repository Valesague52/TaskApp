name: Cypress Tests

on:
  push:
    branches:
      - main

jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Cypress 16 necesita Node 22 o superior

      - name: Instalar dependencias
        run: npm ci

      - name: Iniciar aplicación
        run: |
          node server.js &
          sleep 10

      - name: Ejecutar Cypress
        run: npx cypress run

      - name: Subir screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore

      - name: Subir videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          if-no-files-found: ignore
